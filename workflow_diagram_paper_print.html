<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مخطط دورة حياة طلبات الشراء والاعتمادات - شركة الإشبيليّة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap');

  @page {
    size: A3 portrait;
    margin: 8mm;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #ffffff;
    color: #0f172a;
    font-family: 'Cairo', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .container {
    width: 980px;
    max-width: 100%;
    background: #ffffff;
  }
  .header {
    text-align: center;
    padding-bottom: 12px;
    margin-bottom: 15px;
    border-bottom: 2px solid #0f172a;
  }
  .title { font-size: 23px; font-weight: 900; color: #0f172a; }
  .subtitle { font-size: 13px; font-weight: 700; color: #475569; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">مخطط دورة حياة طلبات الشراء والاعتمادات — شركة الإشبيليّة</div>
    <div class="subtitle">مسارات الطلبات والاعتمادات والتوريد والفوترة (Al-Ashbiliya Procurement Workflow)</div>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1620" width="100%" height="100%">
    <defs>
      <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
      </marker>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
      </marker>
    </defs>

    <style>
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 2.2; rx: 6px; }
      .box-danger { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.4; rx: 6px; }
      .box-success { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.4; rx: 6px; }
      .txt { fill: #0f172a; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .txt-sm { fill: #0f172a; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .txt-danger { fill: #dc2626; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
      .txt-success { fill: #15803d; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
      .lbl { fill: #0f172a; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 800; text-anchor: middle; }
      .lbl-sub { fill: #334155; font-family: 'Cairo', sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .line-gray { fill: none; stroke: #334155; stroke-width: 1.9; }
      .line-blue { fill: none; stroke: #0284c7; stroke-width: 2.2; }
      .line-amber { fill: none; stroke: #d97706; stroke-width: 2.2; }
      .line-red { fill: none; stroke: #dc2626; stroke-width: 2; }
      .line-green { fill: none; stroke: #16a34a; stroke-width: 2.2; }
    </style>

    <!-- ================= LEVEL 0: START ================= -->
    <circle cx="500" cy="30" r="11" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="500" y="52" class="lbl">إنشاء الطلب</text>
    <path d="M 500 42 L 500 70" class="line-gray" marker-end="url(#arr-gray)"/>

    <!-- ================= LEVEL 1: DRAFT ================= -->
    <rect x="420" y="72" width="160" height="42" class="box"/>
    <text x="500" y="93" class="txt">DRAFT</text>

    <!-- DRAFT -> SUBMITTED (Normal Employee) -->
    <path d="M 450 114 L 350 162" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="340" y="132" class="lbl">إرسال من موظف عادي</text>

    <!-- DRAFT -> PENDING_EXECUTIVE_APPROVAL (Dept Manager) -->
    <path d="M 530 114 Q 575 180 620 242" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="600" y="180" class="lbl">إرسال من رئيس قسم لنفس قسمه</text>

    <!-- DRAFT -> PENDING_PROCUREMENT_APPROVAL (General Manager) -->
    <path d="M 580 93 Q 810 100 810 338" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="770" y="215" class="lbl">إرسال من المدير العام</text>

    <!-- ================= LEVEL 2: SUBMITTED ================= -->
    <rect x="270" y="165" width="160" height="40" class="box"/>
    <text x="350" y="185" class="txt">SUBMITTED</text>

    <!-- SUBMITTED -> UNDER_REVIEW -->
    <path d="M 350 205 L 350 242" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="350" y="226" class="lbl">بدء المراجعة (Reviewer)</text>

    <!-- ================= LEVEL 3: UNDER_REVIEW & PENDING_EXECUTIVE_APPROVAL ================= -->
    <!-- UNDER_REVIEW (x=240, w=180) -->
    <rect x="240" y="245" width="180" height="42" class="box"/>
    <text x="330" y="266" class="txt">UNDER_REVIEW</text>

    <!-- UNDER_REVIEW -> PENDING_EXECUTIVE_APPROVAL -->
    <path d="M 420 266 L 530 266" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="475" y="252" class="lbl">اعتماد المراجع</text>

    <!-- UNDER_REVIEW -> RETURNED_TO_REQUESTER -->
    <path d="M 330 287 L 330 332" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="375" y="312" class="lbl">إرجاع للتعديل</text>

    <!-- UNDER_REVIEW -> REJECTED -->
    <path d="M 240 275 Q 180 340 375 460" class="line-red" marker-end="url(#arr-red)"/>
    <text x="210" y="370" class="lbl" fill="#dc2626">رفض الطلب</text>

    <!-- RETURNED_TO_REQUESTER (x=230, w=200) -->
    <rect x="230" y="335" width="200" height="40" class="box"/>
    <text x="330" y="355" class="txt-sm">RETURNED_TO_REQUESTER</text>

    <!-- PENDING_EXECUTIVE_APPROVAL (x=535, w=235) -->
    <rect x="535" y="245" width="235" height="42" class="box"/>
    <text x="652" y="266" class="txt">PENDING_EXECUTIVE_APPROVAL</text>

    <!-- PENDING_EXECUTIVE_APPROVAL -> REJECTED -->
    <path d="M 590 287 L 460 452" class="line-red" marker-end="url(#arr-red)"/>
    <text x="555" y="375" class="lbl" fill="#dc2626">رفض تنفيذي</text>

    <!-- PENDING_EXECUTIVE_APPROVAL -> PENDING_PROCUREMENT_APPROVAL (COMMERCIAL) -->
    <path d="M 750 287 Q 810 305 810 338" class="line-amber" marker-end="url(#arr-amber)"/>
    <text x="865" y="308" class="lbl">اعتماد مسار تجاري</text>
    <text x="865" y="323" class="lbl-sub">(COMMERCIAL)</text>

    <!-- PENDING_EXECUTIVE_APPROVAL -> PENDING_ACCOUNTING_APPROVAL (DIRECT) - CURVED CLEAR OF RETURNED -->
    <path d="M 535 275 Q 130 300 130 562" class="line-blue" marker-end="url(#arr-blue)"/>
    <text x="125" y="420" class="lbl">اعتماد مسار مباشر</text>
    <text x="125" y="435" class="lbl-sub">(DIRECT)</text>

    <!-- ================= REJECTED NODE ================= -->
    <rect x="360" y="455" width="130" height="40" class="box-danger"/>
    <text x="425" y="475" class="txt-danger">REJECTED</text>

    <!-- ================= COMMERCIAL TRACK (RIGHT) ================= -->
    <!-- PENDING_PROCUREMENT_APPROVAL -->
    <rect x="690" y="340" width="240" height="42" class="box"/>
    <text x="810" y="361" class="txt">PENDING_PROCUREMENT_APPROVAL</text>

    <!-- -> PENDING_QUOTE_RECOMMENDATIONS -->
    <path d="M 810 382 L 810 428" class="line-amber" marker-end="url(#arr-amber)"/>
    <text x="810" y="408" class="lbl">بدء عروض الأسعار</text>

    <!-- PENDING_QUOTE_RECOMMENDATIONS -->
    <rect x="685" y="430" width="250" height="44" class="box"/>
    <text x="810" y="452" class="txt">PENDING_QUOTE_RECOMMENDATIONS</text>

    <!-- Quote Loop: Accounting First -->
    <path d="M 905 474 Q 950 530 885 570 Q 845 570 845 477" class="line-amber" marker-end="url(#arr-amber)"/>
    <text x="930" y="530" class="lbl">ترشيح الحسابات أولاً</text>

    <!-- -> PENDING_EXECUTIVE_QUOTE_DECISION -->
    <path d="M 740 474 L 685 565" class="line-amber" marker-end="url(#arr-amber)"/>
    <text x="700" y="515" class="lbl">ترشيح القسم ثانياً</text>

    <!-- PENDING_EXECUTIVE_QUOTE_DECISION (widened to 280px) -->
    <rect x="525" y="568" width="280" height="42" class="box"/>
    <text x="665" y="589" class="txt-sm">PENDING_EXECUTIVE_QUOTE_DECISION</text>

    <!-- -> APPROVED_BY_PROCUREMENT -->
    <path d="M 665 610 L 665 658" class="line-amber" marker-end="url(#arr-amber)"/>
    <text x="665" y="638" class="lbl">قرار المدير العام (اختيار العرض)</text>

    <!-- APPROVED_BY_PROCUREMENT -->
    <rect x="560" y="660" width="210" height="42" class="box"/>
    <text x="665" y="681" class="txt">APPROVED_BY_PROCUREMENT</text>

    <!-- -> PO_DRAFT (from Procurement) -->
    <path d="M 630 702 L 530 768" class="line-amber" marker-end="url(#arr-amber)"/>
    <text x="630" y="735" class="lbl">إنشاء أمر الشراء التجاري</text>

    <!-- ================= DIRECT TRACK (LEFT) ================= -->
    <!-- PENDING_ACCOUNTING_APPROVAL -->
    <rect x="40" y="565" width="235" height="42" class="box"/>
    <text x="157" y="586" class="txt">PENDING_ACCOUNTING_APPROVAL</text>

    <!-- -> APPROVED_BY_ACCOUNTING -->
    <path d="M 157 607 L 157 655" class="line-blue" marker-end="url(#arr-blue)"/>
    <text x="157" y="635" class="lbl">اعتماد مالي وتخصيص البنود والمورد</text>

    <!-- APPROVED_BY_ACCOUNTING -->
    <rect x="45" y="657" width="225" height="42" class="box"/>
    <text x="157" y="678" class="txt">APPROVED_BY_ACCOUNTING</text>

    <!-- -> PO_DRAFT (from Accounting) -->
    <path d="M 215 699 L 415 768" class="line-blue" marker-end="url(#arr-blue)"/>
    <text x="260" y="738" class="lbl">إنشاء أمر الشراء المباشر</text>

    <!-- ================= LEVEL 7: PO_DRAFT (CONVERGENCE) ================= -->
    <rect x="395" y="765" width="150" height="44" class="box"/>
    <text x="470" y="787" class="txt">PO_DRAFT</text>

    <!-- PO_DRAFT -> ISSUED -->
    <path d="M 470 809 L 470 855" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="470" y="835" class="lbl">إصدار أمر الشراء الرسمي</text>

    <!-- ================= LEVEL 8: ISSUED ================= -->
    <rect x="405" y="857" width="130" height="40" class="box"/>
    <text x="470" y="877" class="txt">ISSUED</text>

    <!-- ISSUED -> PENDING_SITE_ENGINEER -->
    <path d="M 490 897 L 540 952" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="575" y="920" class="lbl">تسجيل الاستلام بالمخزن</text>
    <text x="575" y="935" class="lbl-sub">(مواد مشاريع)</text>

    <!-- ISSUED -> APPROVED_RECEIPT (Office Supplies Direct) -->
    <path d="M 430 897 Q 345 950 375 1055" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="320" y="965" class="lbl">استلام مكتبي مباشر</text>
    <text x="320" y="980" class="lbl-sub">(مستلزمات مكتبية)</text>

    <!-- ================= LEVEL 9: PENDING_SITE_ENGINEER ================= -->
    <rect x="470" y="955" width="200" height="42" class="box"/>
    <text x="570" y="976" class="txt">PENDING_SITE_ENGINEER</text>

    <!-- PENDING_SITE_ENGINEER -> APPROVED_RECEIPT -->
    <path d="M 540 997 L 490 1055" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="555" y="1025" class="lbl">فحص واعتماد مهندس الموقع</text>

    <!-- ================= LEVEL 10: APPROVED_RECEIPT ================= -->
    <rect x="370" y="1057" width="200" height="42" class="box"/>
    <text x="470" y="1078" class="txt">APPROVED_RECEIPT</text>

    <!-- APPROVED_RECEIPT -> INVOICE_OPEN -->
    <path d="M 470 1099 L 470 1145" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="470" y="1125" class="lbl">تسجيل فاتورة المورد</text>

    <!-- ================= LEVEL 11: INVOICE_OPEN ================= -->
    <rect x="385" y="1147" width="170" height="40" class="box"/>
    <text x="470" y="1167" class="txt">INVOICE_OPEN</text>

    <!-- INVOICE_OPEN -> INVOICE_MATCHED -->
    <path d="M 470 1187 L 470 1235" class="line-gray" marker-end="url(#arr-gray)"/>
    <text x="470" y="1215" class="lbl">المطابقة الثلاثية</text>

    <!-- ================= LEVEL 12: INVOICE_MATCHED ================= -->
    <rect x="375" y="1237" width="190" height="42" class="box"/>
    <text x="470" y="1258" class="txt">INVOICE_MATCHED</text>

    <!-- INVOICE_MATCHED -> COMPLETED -->
    <path d="M 470 1279 L 470 1335" class="line-green" marker-end="url(#arr-green)"/>
    <text x="470" y="1310" class="lbl" fill="#15803d">سداد دفعة المورد وإغلاق الدورة</text>

    <!-- ================= LEVEL 13: COMPLETED ================= -->
    <rect x="390" y="1337" width="160" height="44" class="box-success"/>
    <text x="470" y="1359" class="txt-success">COMPLETED</text>

    <!-- COMPLETED -> END -->
    <path d="M 470 1381 L 470 1425" class="line-green" marker-end="url(#arr-green)"/>
    <circle cx="470" cy="1440" r="14" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="470" cy="1440" r="7" fill="#0f172a"/>
  </svg>
</div>
</body>
</html>
