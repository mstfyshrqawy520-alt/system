[phases.build]
cmds = [
    'npm ci',
    'npm run build',
    'cp -r dist/. public/'
]

[start]
cmd = 'export PHP_CLI_SERVER_WORKERS=10 && php artisan migrate --force && php artisan db:seed --class=RestoreDemoAccountsSeeder --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && (php artisan queue:work --sleep=1 --tries=3 &) && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
